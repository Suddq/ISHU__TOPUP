<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISHU TOPUP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin: auto;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #1ebe5d;
        }
        #loading {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ISHU TOPUP</h2>
    
    <div class="form-group">
        <label for="uid">Player ID (UID):</label>
        <input type="text" id="uid" placeholder="UID එක ඇතුළත් කරන්න">
    </div>
    
    <div class="form-group">
        <label for="package">ORDER ITEMS:</label>
        <select id="package">
            <option value="Weekly Lite Membership x 1 = Rs. 130">Weekly Lite Membership x 1 = Rs. 130</option>
            <option value="Weekly Membership x 1 = Rs. 450">Weekly Membership x 1 = Rs. 450</option>
            <option value="100 Diamonds x 1 = Rs. 180">100 Diamonds x 1 = Rs. 180</option>
        </select>
    </div>

    <div class="form-group">
        <label for="slip">Payment Slip එක Upload කරන්න:</label>
        <input type="file" id="slip" accept="image/*">
    </div>

    <button id="topupBtn" onclick="uploadAndSend()">TOP UP NOW</button>
    <div id="loading">ස්ලිප් එක Upload වෙමින් පවතී,කරුණාකර රැඳී සිටින්න...</div>
</div>

<script>
    async function uploadAndSend() {
        const uid = document.getElementById('uid').value.trim();
        const selectedPackage = document.getElementById('package').value;
        const slipInput = document.getElementById('slip');
        const loadingDiv = document.getElementById('loading');
        const topupBtn = document.getElementById('topupBtn');

        // මෙතනට ඔබේ WhatsApp අංකය දාන්න (උදා: 9477xxxxxxx)
        const whatsappNumber = "947XXXXXXXX"; 

        if (uid === "") {
            alert("කරුණාකර ඔබේ Player ID (UID) එක ඇතුළත් කරන්න!");
            return;
        }

        if (slipInput.files.length === 0) {
            alert("කරුණාකර පේමන්ට් ස්ලිප් එක Upload කරන්න!");
            return;
        }

        const file = slipInput.files[0];
        const formData = new FormData();
        formData.append("image", file);

        loadingDiv.style.display = "block";
        topupBtn.disabled = true;

        try {
            // ImgBB API හරහා ස්ලිප් එක අන්තර්ජාලයට අප්ලෝඩ් කර ස්ථිර ලින්ක් එකක් ලබා ගැනීම
            const response = await fetch('https://api.imgbb.com/1/upload?key=YOUR_IMGBB_API_KEY', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            loadingDiv.style.display = "none";
            topupBtn.disabled = false;

            if (data.success) {
                const slipUrl = data.data.url;

                // WhatsApp එකට යැවෙන පණිවිඩය
                const message = `*NEW ORDER - ISHU TOPUP*%0A%0A*Player ID (UID):* ${uid}%0A*Slip Link/Ref:* ${slipUrl}%0A------------------------%0A*ORDER ITEMS:* ${selectedPackage}%0A------------------------%0A*TOTAL BILL:* Rs. 130 %0A*මම මුදල් තැන්පත් කර ඇත.*`;

                const whatsappURL = `https://wa.me/${whatsappNumber}?text=${message}`;
                window.open(whatsappURL, '_blank');
            } else {
                alert("ස්ලිප් එක අප්ලෝඩ් කිරීමේ දෝෂයක් සිදු විය. කරුණාකර නැවත උත්සාහ කරන්න.");
            }
        } catch (error) {
            loadingDiv.style.display = "none";
            topupBtn.disabled = false;
            alert("ජාල දෝෂයක් (Network Error) සිදු විය. කරුණාකර අන්තර්ජාල සම්බන්ධතාව පරීක්ෂා කරන්න.");
        }
    }
</script>

</body>
</html>
