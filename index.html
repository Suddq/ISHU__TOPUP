<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Top-Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin: auto;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #1ebe5d;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Free Fire Top-Up</h2>
    <div class="form-group">
        <label for="uid">Player UID:</label>
        <input type="text" id="uid" placeholder="ඔබේ Player UID එක ඇතුළත් කරන්න">
    </div>
    
    <div class="form-group">
        <label for="package">패කේජය තෝරන්න (Select Package):</label>
        <select id="package">
            <option value="100 Diamonds">100 Diamonds</option>
            <option value="310 Diamonds">310 Diamonds</option>
            <option value="520 Diamonds">520 Diamonds</option>
            <option value="1060 Diamonds">1060 Diamonds</option>
        </select>
    </div>

    <button onclick="sendOrder()">WhatsApp හරහා Order කරන්න</button>
</div>

<script>
    function sendOrder() {
        const uid = document.getElementById('uid').value.trim();
        const selectedPackage = document.getElementById('package').value;
        
        // මෙතනට ඔබේ WhatsApp අංකය දාන්න (உதாரණයක් ලෙස: 94771234567 - රටේ කේතය සමඟ)
        const whatsappNumber = "947XXXXXXXX"; 

        if (uid === "") {
            alert("කරුණාකර ඔබේ Player UID එක ඇතුළත් කරන්න!");
            return;
        }

        // WhatsApp එකට යැවෙන පණිවිඩය සකස් කිරීම
        const message = `Halo, මම Free Fire Top-up එකක් කිරීමට අවශ්‍යයි.%0A%0A*Player UID:* ${uid}%0A*Package:* ${selectedPackage}`;

        // WhatsApp ලින්ක් එක විවෘත කිරීම
        const whatsappURL = `https://wa.me/${whatsappNumber}?text=${message}`;
        window.open(whatsappURL, '_blank');
    }
</script>

</body>
</html>
